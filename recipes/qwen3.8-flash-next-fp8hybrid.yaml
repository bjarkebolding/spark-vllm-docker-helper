# Qwen3.8-Flash-Next (NVFP4) on a single GB10 / DGX Spark, for eugr/spark-vllm-docker.
#
# Add-on recipe — use it with your existing checkout, unmodified:
#   cd spark-vllm-docker
#   ./run-recipe.sh /abs/path/to/recipes/qwen3.8-flash-next-nvfp4.yaml --solo --setup --earlyoom -d
#
# Builds a `vllm-node-flashnext` image from OFFICIAL vllm-project/vllm @ 16d6c376
# (2026-08-29 main, = PR #54129's merge-base) + PR #54129 (disk-mmap PLE,
# VLLM_PLE_MMAP; stacks the model PR #53896), fetched from vllm-project/vllm's own
# pull/54129 endpoint. No third-party vLLM repo. If #54129 is rebased and stops
# applying, use the frozen diff in ../patches/ (see README).
#
# This variant also stores the dense side layers (GDN/QSA/shared-expert projections,
# ~15 GiB bf16) as blockwise fp8. Needs --apply-mod qwen4-exp-fp8-hybrid (builds the
# checkpoint once + installs the shim). Measured on one GB10, non-streaming: ~32 prose
# / ~36 code, 594k KV, 35k needle, greedy-deterministic — ~+18% decode over plain NVFP4.

recipe_version: "1"
name: Qwen3.8-Flash-Next-FP8Hybrid
description: Qwen3.8-Flash-Next NVFP4 experts + fp8 dense side layers on one GB10

model: RadixArk/Qwen3.8-Flash-Next-NVFP4
solo_only: true
container: vllm-node-flashnext

build_args:
  - --rebuild-vllm
  - --vllm-ref
  - 16d6c376bc55e2e44ce012d26104c8af11e27c25
  - --apply-vllm-pr
  - "54129"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 8
  num_speculative_tokens: 2      # 3 is a wash here (QSA-state rebuilds draft metadata at k>=3)

env:
  CUTE_DSL_ARCH: sm_121a
  VLLM_FP8_HYBRID: "1"
  VLLM_USE_DEEP_GEMM: "0"     # DeepGEMM blockwise-fp8 emits garbage on sm_121; CUTLASS is correct
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WORKERS: "24"
  VLLM_PLE_MMAP_READAHEAD: "16384"
  VLLM_PLE_MMAP_PREWARM: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  OMP_NUM_THREADS: "4"

# --no-enable-prefix-caching : GDN crashes on sm_121 with prefix caching (vLLM #54173).
# --no-enable-flashinfer-autotune : NVFP4-MoE autotune crashes on sm_121 (FlashInfer
#   #4003); disabling it also cuts ~150 s off startup. No measurable decode cost.
# --kv-cache-dtype auto : QSA refuses fp8.
# --compilation-config PIECEWISE : VLLM_PLE_MMAP refuses FULL graphs / --enforce-eager.
# --moe-backend : leave on auto (-> FLASHINFER_CUTLASS). b12x and marlin both error
#   because the MTP draft has unquantized BF16 MoE layers.
command: |
  vllm serve /root/.cache/huggingface/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/fp8hybrid \
    --served-model-name qwen3.8-flash-next \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens 8192 \
    --kv-cache-dtype auto \
    --enable-chunked-prefill \
    --no-enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --compilation-config '{{"cudagraph_mode":"PIECEWISE"}}'
